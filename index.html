<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePostcard Studio · app-style editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f6f9fc;
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.03) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.03) 0%, transparent 40%);
            overflow-x: hidden;
            position: relative;
            padding: 24px 16px;
        }

        .studio-wrapper {
            display: flex;
            gap: 24px;
            max-width: 1300px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            z-index: 10;
        }

        /* ----------  CARD BASE  ---------- */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.06), 0 4px 12px -4px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(226, 232, 240, 0.6);
            padding: 28px;
            text-align: center;
            transition: box-shadow 0.2s;
        }

        /* ----------  EDITOR (app-style panel)  ---------- */
        .editor-container {
            max-width: 620px;
            text-align: left;
            max-height: 90vh;
            overflow-y: auto;
            padding: 0 28px 32px 32px;
            background: #ffffff;
            border-radius: 36px;
            border: 1px solid #e9eef4;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.08), 0 8px 16px -8px rgba(0, 0, 0, 0.02);
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
            position: relative;
        }

        .editor-container::-webkit-scrollbar {
            width: 5px;
        }

        .editor-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .editor-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* ----------  HEADER  ---------- */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding: 24px 0 14px 0;
            border-bottom: 1.5px solid #f1f5f9;
            gap: 12px;
        }

        .editor-header h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .editor-header h2 span {
            background: #eef2ff;
            color: #4f46e5;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid #c7d2fe;
        }

        .lang-toggle {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            border: 1.5px solid #eef2f6;
            border-radius: 40px;
            padding: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-toggle:hover {
            border-color: #cbd5e1;
        }

        .lang-opt {
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .lang-opt.active {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            box-shadow: 0 3px 8px -2px rgba(79, 70, 229, 0.4);
        }

        /* ----------  SHORTCUT BAR  ---------- */
        .shortcut-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0 10px 0;
            background: #ffffff;
            border-bottom: 1.5px solid #f1f5f9;
            margin: 0 -28px 18px -32px;
            padding-left: 32px;
            padding-right: 28px;
            scrollbar-width: none;
        }

        .shortcut-bar::-webkit-scrollbar {
            display: none;
        }

        .shortcut-chip {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            border: 1.5px solid #eef2f6;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.1px;
        }

        .shortcut-chip:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #334155;
        }

        .shortcut-chip.active {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.35);
        }

        .shortcut-chip .chip-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.6;
        }

        .shortcut-chip.add-chip {
            background: #ecfdf5;
            border-color: #bbf7d0;
            color: #059669;
            font-weight: 700;
        }

        .shortcut-chip.add-chip:hover {
            background: #d1fae5;
            border-color: #86efac;
            color: #047857;
        }

        /* ----------  FORM ELEMENTS  ---------- */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #f9fbfd;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.01);
        }

        .form-group input:hover,
        .form-group textarea:hover,
        .form-group select:hover {
            border-color: #cbd5e1;
            background: #ffffff;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            background: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.12), 0 2px 8px rgba(99, 102, 241, 0.06);
        }

        .form-group input[type="color"] {
            padding: 3px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            background: #ffffff;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            transition: border-color 0.2s;
        }

        .form-group input[type="color"]:hover {
            border-color: #94a3b8;
        }

        .color-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .color-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        /* ----------  SPECIAL BOXES  ---------- */
        .intro-editor-box {
            background: #fef7f7;
            border: 1.5px solid #ffe4e6;
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 12px -4px rgba(225, 29, 72, 0.04);
        }

        .intro-editor-box h4 {
            color: #db2777;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1.5px solid #ffe4e6;
            padding-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .success-editor-box {
            background: #f2fdf8;
            border: 1.5px solid #bbf7d0;
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 12px -4px rgba(16, 185, 129, 0.04);
        }

        .success-editor-box h4 {
            color: #059669;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1.5px solid #dcfce7;
            padding-bottom: 10px;
            letter-spacing: -0.2px;
        }

        /* ----------  FLOATING ACTION BUTTONS  ---------- */
        .fab-stack {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .fab-btn {
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 14px 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .fab-btn:hover {
            transform: translateY(-2px);
        }

        .fab-preview {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            box-shadow: 0 12px 28px -6px rgba(124, 58, 237, 0.45);
        }

        .fab-preview:hover {
            box-shadow: 0 16px 32px -6px rgba(124, 58, 237, 0.55);
        }

        .fab-telegram {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.45);
        }

        .fab-telegram:hover {
            box-shadow: 0 16px 32px -6px rgba(37, 99, 235, 0.55);
        }

        /* ----------  TELEGRAM POPUP ---------- */
        .telegram-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 900;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .telegram-modal-overlay.open {
            display: flex;
        }

        .telegram-modal {
            background: #ffffff;
            border-radius: 28px;
            padding: 26px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.25);
            animation: modalPop 0.25s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .telegram-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1.5px solid #f1f5f9;
        }

        .telegram-modal-header h4 {
            color: #0369a1;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .telegram-modal-close {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }

        .telegram-modal-close:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        /* ----------  STEP BOX  ---------- */
        .step-box {
            background: #ffffff;
            border: 1.5px solid #eef2f6;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.02);
            scroll-margin-top: 80px;
        }

        .step-box:hover {
            border-color: #cbd5e1;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.06);
        }

        .step-box.highlight {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        .step-box h4 {
            color: #1e293b;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #f1f5f9;
            padding-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .delete-step-btn {
            background: #fef2f2;
            color: #dc2626;
            border: none;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.2px;
        }

        .delete-step-btn:hover {
            background: #ef4444;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
        }

        /* ----------  BUTTONS  ---------- */
        .btn-main {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            padding: 14px 24px;
            font-size: 14px;
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.3);
            letter-spacing: 0.2px;
        }

        .btn-main:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background: #ffffff;
            color: #334155;
            font-weight: 600;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            padding: 12px 20px;
            font-size: 13px;
            margin-top: 8px;
            width: 100%;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
            transform: translateY(-1px);
        }

        /* ----------  PREVIEW PANEL  ---------- */
        .preview-container {
            max-width: 440px;
            position: sticky;
            top: 24px;
            background: #ffffff;
            border-radius: 36px;
            border: 1px solid #e9eef4;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: #f8fafc;
            padding: 10px 16px;
            border-radius: 18px;
            border: 1px solid #eef2f6;
        }

        .preview-header h3 {
            color: #1e293b;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.2px;
        }

        .preview-step-select {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1.5px solid #e2e8f0;
            font-size: 11px;
            outline: none;
            background: #ffffff;
            color: #1e293b;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .preview-step-select:hover {
            border-color: #a5b4fc;
        }

        .gif-container {
            width: 120px;
            height: 120px;
            margin: 14px auto;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            border-radius: 22px;
            object-fit: cover;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.08);
        }

        .btn-group {
            position: relative;
            min-height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        button.choice-btn {
            padding: 12px 26px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            box-shadow: 0 6px 14px -4px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.2px;
        }

        .fullscreen-active {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #captureArea {
            background: transparent;
            border: none;
            padding: 0;
            text-align: center;
        }

        #captureArea h3 {
            margin-bottom: 14px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .result-item {
            background: #ffffff;
            border: 1px solid #eef2f6;
            border-radius: 16px;
            padding: 12px 16px;
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.02);
            gap: 6px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        .result-q {
            font-size: 13px;
            color: #334155;
            flex: 1;
            padding-right: 8px;
            font-weight: 500;
        }

        .result-a {
            background: #6366f1;
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .result-no-count {
            font-size: 10px;
            color: #f43f5e;
            font-weight: 600;
            letter-spacing: 0.1px;
        }

        #sendingStatus {
            display: none;
            font-size: 13px;
            color: #6366f1;
            margin-top: 12px;
            font-weight: 600;
            letter-spacing: 0.1px;
        }

        .heart-start-btn {
            cursor: pointer;
            margin: 14px auto;
            display: inline-block;
            user-select: none;
            transition: transform 0.2s;
        }

        .heart-start-btn:hover {
            transform: scale(1.04);
        }

        .heart-start-btn img {
            width: 110px;
            height: auto;
            display: block;
            border: none;
            outline: none;
            background: transparent;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.06));
        }

        .burst-emoji {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 99999;
            animation: burstAnim 0.8s ease-out forwards;
        }

        @keyframes burstAnim {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
        }

        @keyframes shakeAnim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
        .shake-active { animation: shakeAnim 0.4s ease; }

        @keyframes bounceAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .bounce-active { animation: bounceAnim 0.4s ease; }

        @media(max-width: 950px) {
            .studio-wrapper { flex-direction: column; align-items: center; }
            .preview-container { position: static; width: 100%; max-width: 440px; }
            .editor-container { max-height: none; padding: 0 24px 24px 24px; }
            .shortcut-bar { margin: 0 -24px 18px -24px; padding-left: 24px; padding-right: 24px; }
        }
    </style>
</head>
<body>

    <div class="studio-wrapper">
        <!-- 1. MODERN APP-STYLE EDITOR VIEW -->
        <div class="card-container editor-container" id="editorView">
            <div class="editor-header">
                <h2>✦ ePostcard Studio <span>LIVE</span></h2>
                <div class="lang-toggle" onclick="toggleLanguage()">
                    <span class="lang-opt active" id="langMM">MM</span>
                    <span class="lang-opt" id="langEN">ENG</span>
                </div>
            </div>

            <!-- SHORTCUT BAR -->
            <div class="shortcut-bar" id="shortcutBar">
                <!-- Dynamically populated -->
            </div>

            <div class="form-group">
                <label id="lblFormspree">Formspree endpoint</label>
                <input type="text" id="inputFormspree" placeholder="https://formspree.io/f/your_id">
            </div>

            <!-- INTRO SCREEN EDITOR -->
            <div class="intro-editor-box" id="section-intro">
                <h4 id="hdrIntro">💖 Intro screen</h4>
                <div class="form-group" style="margin-bottom:12px;">
                    <label id="lblIntroTitle">Title</label>
                    <input type="text" id="inputIntroTitle" value="Hello ရည်းစားဟောင်းလေး" oninput="syncLivePreview()">
                </div>
                <div class="color-row">
                    <div class="form-group">
                        <label id="lblIntroTitleColor">Title color</label>
                        <input type="color" id="inputIntroTitleColor" value="#ff4757" oninput="syncLivePreview()">
                    </div>
                    <div class="form-group">
                        <label id="lblIntroSubColor">Text color</label>
                        <input type="color" id="inputIntroSubColor" value="#64748b" oninput="syncLivePreview()">
                    </div>
                </div>
                <div class="color-row">
                    <div class="form-group" style="flex: 1;">
                        <label id="lblIntroBg">Card background</label>
                        <input type="color" id="inputIntroBg" value="#ffffff" oninput="syncLivePreview()">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label id="lblIntroSubtitle">Subtitle</label>
                    <input type="text" id="inputIntroSubtitle" value="Click The Heart" oninput="syncLivePreview()">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label id="lblIntroGif">Heart GIF (URL or device)</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="inputIntroGif" value="https://media.tenor.com/RjFzdxaLVNMAAAAi/heart.gif" oninput="syncLivePreview()" style="flex: 1;">
                        <input type="file" id="inputIntroGifFile" accept="image/*" style="display: none;" onchange="handleIntroGifUpload(event)">

        // ============================================================
        // DATA
        // ============================================================
        let defaultSteps = [
            { question: "ပြန်ချစ်ကြည့်ကြမလား?", yes: "ချစ်တယ်", no: "မချစ်ဘူး", gif: "https://media1.tenor.com/m/2K0bjyLKldkAAAAC/dudu-dudu-bubu.gif", type: "shrink", qColor: "#1e293b", yesColor: "#0d9488", noColor: "#f43f5e", cardBg: "#ffffff" },

        ];

        let activeSteps = JSON.parse(JSON.stringify(defaultSteps));
        let FORMSPREE_URL = "";

        let currentPreviewStep = "intro";
        let liveYesScale = 1;
        let liveNoScale = 1;

        let currentStep = 0, yesScale = 1, noScale = 1, userAnswers = [];
        let noClickCounts = [];

        // ============================================================
        // SHORTCUT BAR
        // ============================================================
        function renderShortcutBar() {
            const bar = document.getElementById('shortcutBar');
            bar.innerHTML = '';

            // Intro chip
            const introChip = document.createElement('button');
            introChip.type = 'button';
            introChip.className = 'shortcut-chip' + (currentPreviewStep === 'intro' ? ' active' : '');
            introChip.innerHTML = '<span class="chip-dot"></span>' + t('introChip');
            introChip.onclick = () => jumpToSection('intro');
            bar.appendChild(introChip);

            // Step chips
            activeSteps.forEach((s, i) => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'shortcut-chip' + (currentPreviewStep === i ? ' active' : '');
                chip.innerHTML = `<span class="chip-dot"></span>${i + 1}. ${s.question.substring(0, 14)}${s.question.length > 14 ? '…' : ''}`;
                chip.onclick = () => jumpToSection(i);
                bar.appendChild(chip);
            });

            // Add Step chip
            const addChip = document.createElement('button');
            addChip.type = 'button';
            addChip.className = 'shortcut-chip add-chip';
            addChip.innerHTML = t('addStep');
            addChip.onclick = () => addNewStep();
            bar.appendChild(addChip);

            // Success chip
            const successChip = document.createElement('button');
            successChip.type = 'button';
            successChip.className = 'shortcut-chip' + (currentPreviewStep === 'success' ? ' active' : '');
            successChip.innerHTML = '<span class="chip-dot"></span>' + t('successChip');
            successChip.onclick = () => jumpToSection('success');
            bar.appendChild(successChip);
        }

        function jumpToSection(target) {
            document.querySelectorAll('.shortcut-chip').forEach(c => c.classList.remove('active'));

            if (target === 'intro') {
                currentPreviewStep = 'intro';
                document.getElementById('previewStepSelector').value = 'intro';
                document.getElementById('section-intro').scrollIntoView({ behavior: 'smooth', block: 'start' });
                document.getElementById('section-intro').classList.add('highlight');
                setTimeout(() => document.getElementById('section-intro').classList.remove('highlight'), 1200);
            } else if (target === 'success') {
                currentPreviewStep = 'success';
                document.getElementById('previewStepSelector').value = 'success';
                document.getElementById('section-success').scrollIntoView({ behavior: 'smooth', block: 'start' });
                document.getElementById('section-success').classList.add('highlight');
                setTimeout(() => document.getElementById('section-success').classList.remove('highlight'), 1200);
            } else {
                currentPreviewStep = target;
                document.getElementById('previewStepSelector').value = target;
                const stepEl = document.getElementById(`eq_${target}`);
                if (stepEl) {
                    const box = stepEl.closest('.step-box');
                    if (box) {
                        box.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        box.classList.add('highlight');
                        setTimeout(() => box.classList.remove('highlight'), 1200);
                    }
                }
            }

            liveYesScale = 1;
            liveNoScale = 1;
            updateLivePreviewCard();
            renderShortcutBar();
        }

        // ============================================================
        // TELEGRAM MODAL
        // ============================================================
        function openTelegramModal() {
            document.getElementById('telegramModalOverlay').classList.add('open');
        }

        function closeTelegramModal() {
            document.getElementById('telegramModalOverlay').classList.remove('open');
        }

        function closeTelegramModalOnBackdrop(event) {
            if (event.target === document.getElementById('telegramModalOverlay')) {
                closeTelegramModal();
            }
        }

        // ============================================================
        // EDITOR STEPS
        // ============================================================
        function renderEditorSteps() {
            const container = document.getElementById('stepsEditorList');
            container.innerHTML = "";
            activeSteps.forEach((s, index) => {
                let div = document.createElement('div');
                div.className = 'step-box';
                div.id = `step-box-${index}`;
                div.innerHTML = `
                    <h4>${t('stepLabel')} ${index + 1} <button class="delete-step-btn" type="button" onclick="removeStep(${index})">${t('deleteStep')}</button></h4>
                    <div class="form-group" style="margin-bottom:12px;">
                        <label>${t('question')}</label>
                        <input type="text" value="${s.question}" id="eq_${index}" oninput="syncLivePreview()">
                    </div>
                    <div class="color-row">
                        <div class="form-group">
                            <label>${t('questionColor')}</label>
                            <input type="color" value="${s.qColor || '#1e293b'}" id="eqcol_${index}" oninput="syncLivePreview()">
                        </div>
                        <div class="form-group">
                            <label>${t('cardBg')}</label>
                            <input type="color" value="${s.cardBg || '#ffffff'}" id="ecbg_${index}" oninput="syncLivePreview()">
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px; margin-bottom:12px;">
                        <div style="flex:1;"><label>${t('yesLabel')}</label><input type="text" value="${s.yes}" id="eyes_${index}" oninput="syncLivePreview()"></div>
                        <div style="flex:1;"><label>${t('noLabel')}</label><input type="text" value="${s.no}" id="eno_${index}" oninput="syncLivePreview()"></div>
                    </div>
                    <div class="color-row">
                        <div class="form-group">
                            <label>${t('yesColor')}</label>
                            <input type="color" value="${s.yesColor || '#0d9488'}" id="eyescol_${index}" oninput="syncLivePreview()">
                        </div>
                        <div class="form-group">
                            <label>${t('noColor')}</label>
                            <input type="color" value="${s.noColor || '#f43f5e'}" id="enocol_${index}" oninput="syncLivePreview()">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:12px;">
                        <label>${t('gifLabel')}</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="text" value="${s.gif}" id="egif_${index}" oninput="syncLivePreview()" style="flex: 1;">
                            <input type="file" id="egifFile_${index}" accept="image/*" style="display: none;" onchange="handleStepGifUpload(event, ${index})">
                            <button type="button" class="btn-secondary" style="margin-top:0; width: auto; padding: 10px 16px; font-size: 12px; white-space: nowrap;" onclick="document.getElementById('egifFile_${index}').click()">${t('uploadBtn')}</button>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>${t('animationLabel')}</label>
                        <select id="etype_${index}" onchange="syncLivePreview()">
                            <option value="shrink" ${s.type==='shrink'?'selected':''}>1. shrink (No shrinks, Yes grows)</option>
                            <option value="run" ${s.type==='run'?'selected':''}>2. run (No button runs away)</option>
                            <option value="fade" ${s.type==='fade'?'selected':''}>3. fade (No fades out)</option>
                            <option value="fullscreen" ${s.type==='fullscreen'?'selected':''}>4. fullscreen (Yes goes fullscreen)</option>
                            <option value="magnet" ${s.type==='magnet'?'selected':''}>5. magnet (No click auto-Yes)</option>
                            <option value="shake" ${s.type==='shake'?'selected':''}>6. shake (No shakes)</option>
                            <option value="spin" ${s.type==='spin'?'selected':''}>7. spin (No spins)</option>
                            <option value="bounce" ${s.type==='bounce'?'selected':''}>8. bounce (No bounces)</option>

                            <option value="flip" ${s.type==='flip'?'selected':''}>13. flip (No flips 3D)</option>
                            <option value="grow_yes" ${s.type==='grow_yes'?'selected':''}>14. grow_yes (Yes grows huge)</option>

                        </select>
                    </div>
                `;
                container.appendChild(div);
            });
            updatePreviewStepSelector();
            syncLivePreview();
            renderShortcutBar();
        }

        // Re-apply labels without rebuilding DOM (for language switch)
        function renderEditorStepsLabels() {
            activeSteps.forEach((s, index) => {
                const box = document.getElementById(`step-box-${index}`);
                if (!box) return;
                const h4 = box.querySelector('h4');
                if (h4) {
                    const btn = h4.querySelector('.delete-step-btn');
                    h4.innerHTML = `${t('stepLabel')} ${index + 1} `;
                    if (btn) {
                        btn.textContent = t('deleteStep');
                        h4.appendChild(btn);
                    }
                }
                const labels = box.querySelectorAll('.form-group label');
                if (labels[0]) labels[0].textContent = t('question');
                if (labels[1]) labels[1].textContent = t('questionColor');
                if (labels[2]) labels[2].textContent = t('cardBg');
                if (labels[3]) labels[3].textContent = t('yesLabel');
                if (labels[4]) labels[4].textContent = t('noLabel');

        function updatePreviewStepSelector() {
            const selector = document.getElementById('previewStepSelector');
            const prevVal = selector.value;

        function changePreviewStep(val) {

            liveYesScale = 1;
            liveNoScale = 1;

            renderShortcutBar();
        }

        function syncLivePreview() {
            FORMSPREE_URL = document.getElementById('inputFormspree').value.trim();
            for(let i=0; i<activeSteps.length; i++) {
                const qEl = document.getElementById(`eq_${i}`);
                const qColEl = document.getElementById(`eqcol_${i}`);
                const cBgEl = document.getElementById(`ecbg_${i}`);
                const yesEl = document.getElementById(`eyes_${i}`);
                const noEl = document.getElementById(`eno_${i}`);
                const yesColEl = document.getElementById(`eyescol_${i}`);
                const noColEl = document.getElementById(`enocol_${i}`);
                const gifEl = document.getElementById(`egif_${i}`);
                const typeEl = document.getElementById(`etype_${i}`);

                if(qEl) activeSteps[i].question = qEl.value;
                if(qColEl) activeSteps[i].qColor = qColEl.value;
                if(cBgEl) activeSteps[i].cardBg = cBgEl.value;
                if(yesEl) activeSteps[i].yes = yesEl.value;
                if(noEl) activeSteps[i].no = noEl.value;
                if(yesColEl) activeSteps[i].yesColor = yesColEl.value;
                if(noColEl) activeSteps[i].noColor = noColEl.value;
                if(gifEl) activeSteps[i].gif = gifEl.value;
                if(typeEl) activeSteps[i].type = typeEl.value;
            }
            updateLivePreviewCard();
            // Update shortcut bar labels
            document.querySelectorAll('.shortcut-chip').forEach((chip, idx) => {
                if (idx > 0 && idx <= activeSteps.length) {
                    const s = activeSteps[idx - 1];
                    chip.innerHTML = `<span class="chip-dot"></span>${idx}. ${s.question.substring(0, 14)}${s.question.length > 14 ? '…' : ''}`;
                }
            });
        }

        function updateLivePreviewCard() {
            const container = document.getElementById('previewCardContent');
            const panel = document.getElementById('livePreviewPanel');
            
            if (currentPreviewStep === "intro") {
                const title = document.getElementById('inputIntroTitle').value;
                const titleColor = document.getElementById('inputIntroTitleColor').value;
                const subColor = document.getElementById('inputIntroSubColor').value;
                const bg = document.getElementById('inputIntroBg').value;
                const subtitle = document.getElementById('inputIntroSubtitle').value;
                const gif = document.getElementById('inputIntroGif').value;

                panel.style.background = bg || "#ffffff";
                container.innerHTML = `
                    <h2 style="color: ${titleColor}; margin-bottom: 10px; font-size: 22px;">${title}</h2>
                    <p style="color: ${subColor}; font-size: 14px; margin-bottom: 8px;">${subtitle}</p>
                    <div class="heart-start-btn" style="cursor: default;">
                        <img src="${gif}" alt="Heart GIF" style="width: 110px; height: auto; display: block; margin: 0 auto;">
                    </div>
                    <p style="font-size: 11px; color: #94a3b8; margin-top: 12px;">(Click the heart in full screen to test)</p>
                `;
            } else if (currentPreviewStep === "success") {
                const title = document.getElementById('inputSuccessTitle').value;
                const titleColor = document.getElementById('inputSuccessTitleColor').value;
                const bg = document.getElementById('inputSuccessBg').value;

                panel.style.background = bg || "#ffffff";
                container.innerHTML = `
                    <div style="background: transparent; border: none; padding: 0;">
                        <h3 style="color: ${titleColor}; margin-bottom: 14px; font-size: 18px; font-weight: 700;">${title}</h3>
                        <div class="result-item">
                            <div class="result-row">
                                <span class="result-q">1. Sample question</span>
                                <span class="result-a">Yes</span>
                            </div>
                            <div class="result-no-count">❌ No clicks: 0</div>
                        </div>
                    </div>
                `;
            } else {
                let idx = currentPreviewStep;
                if (idx >= activeSteps.length) idx = 0;
                const s = activeSteps[idx];

                panel.style.background = s.cardBg || "#ffffff";
                container.innerHTML = `
                    <h2 id="liveQuestionText" style="color: ${s.qColor || '#1e293b'}; font-size: 20px;">${s.question}</h2>
                    <div class="gif-container"><img id="liveStatusGif" src="${s.gif}"></div>
                    <div class="btn-group" id="liveBtnGroup">
                        <button id="liveYesBtn" class="choice-btn" onclick="handleLiveInteraction(true)" style="background: ${s.yesColor || '#0d9488'}; color: white; transform: scale(${liveYesScale})">${s.yes}</button>
                        <button id="liveNoBtn" class="choice-btn" onclick="handleLiveInteraction(false)" style="background: ${s.noColor || '#f43f5e'}; color: white; transform: scale(${liveNoScale})">${s.no}</button>
                    </div>
                `;
            }
        }

        function handleLiveInteraction(isYes) {
            if (currentPreviewStep === "intro" || currentPreviewStep === "success") return;
            const s = activeSteps[currentPreviewStep];

            if (isYes) {
                alert(`[Live Preview] "${s.yes}" clicked ✅`);
                currentPreviewStep = (currentPreviewStep + 1) % activeSteps.length;
                document.getElementById('previewStepSelector').value = currentPreviewStep;
                liveYesScale = 1;
                liveNoScale = 1;
                updateLivePreviewCard();
                renderShortcutBar();
            } else {
                alert(`[Live Preview] Animation type (${s.type}) is working!`);
            }
        }

        function addNewStep() {
            activeSteps.push({ question: "New question?", yes: "Yes", no: "No", gif: "https://media1.tenor.com/m/2K0bjyLKldkAAAAC/dudu-dudu-bubu.gif", type: "shrink", qColor: "#1e293b", yesColor: "#0d9488", noColor: "#f43f5e", cardBg: "#ffffff" });
            renderEditorSteps();
            // Scroll to new step
            const newIdx = activeSteps.length - 1;
            const newBox = document.getElementById(`step-box-${newIdx}`);
            if (newBox) {
                setTimeout(() => {
                    newBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    newBox.classList.add('highlight');
                    setTimeout(() => newBox.classList.remove('highlight'), 1200);
                }, 100);
            }
            jumpToSection(newIdx);
        }

        function removeStep(index) {
            if(activeSteps.length <= 1) {
                alert("At least one step is required.");
                return;
            }
            activeSteps.splice(index, 1);
            if (currentPreviewStep !== 'intro' && currentPreviewStep !== 'success' && currentPreviewStep >= activeSteps.length) {
                currentPreviewStep = activeSteps.length - 1;
            }
            renderEditorSteps();
        }

        function fullScreenPreview() {
            FORMSPREE_URL = document.getElementById('inputFormspree').value.trim();
            syncLivePreview();

            const introCard = document.getElementById('introScreen');
            introCard.style.background = document.getElementById('inputIntroBg').value || "#ffffff";
            document.getElementById('introTitleText').innerText = document.getElementById('inputIntroTitle').value;
            document.getElementById('introTitleText').style.color = document.getElementById('inputIntroTitleColor').value;
            document.getElementById('introSubtitleText').innerText = document.getElementById('inputIntroSubtitle').value;
            document.getElementById('introSubtitleText').style.color = document.getElementById('inputIntroSubColor').value;
            document.getElementById('introHeartImg').src = document.getElementById('inputIntroGif').value;

            noClickCounts = new Array(activeSteps.length).fill(0);
            currentStep = 0;

            document.getElementById('playModeWrapper').style.display = 'flex';

        function exitPlayMode() {
            document.getElementById('playModeWrapper').style.display = 'none';

            document.getElementById('successScreen').style.display = 'none';

        document.getElementById('startHeartBtn').onclick = function(e) {
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const emojis = ['❤️', '💖', '💕', '💘', '💓', '💗', '💞'];
            
            for (let i = 0; i < 22; i++) {
                let emojiEl = document.createElement('div');
                emojiEl.className = 'burst-emoji';
                emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                let angle = Math.random() * Math.PI * 2;
                let distance = 70 + Math.random() * 110;
                emojiEl.style.left = `${x}px`;
                emojiEl.style.top = `${y}px`;
                emojiEl.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                emojiEl.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(emojiEl);
                setTimeout(() => emojiEl.remove(), 800);
            }

            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
                updateCard();
            }, 350);
        };

        function handleInteraction(isYes) {
            nextStep(isYes);
        }

        function nextStep(isYes) {
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('fullscreen-active');
            
            userAnswers.push({ 
                q: activeSteps[currentStep].question, 
                a: isYes ? activeSteps[currentStep].yes : activeSteps[currentStep].no,
                noCount: noClickCounts[currentStep] 
            });
            
            currentStep++;
            if (currentStep < activeSteps.length) {
                updateCard();
            } else {
                sendAnswersToFormspree();
            }
        }

        function handleNoClick() {
            noClickCounts[currentStep]++; 
            
            const step = activeSteps[currentStep];
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            if (step.type === "shrink") { 
                yesScale += 0.3; yesBtn.style.transform = `scale(${yesScale})`; 
                noScale -= 0.2; noBtn.style.transform = `scale(${noScale})`; 
            }
            else if (step.type === "fade") {
                noBtn.style.opacity = '0';
            }
            else if (step.type === "fullscreen") {
                yesBtn.classList.add('fullscreen-active');
            }
            else if (step.type === "magnet") { 
                noBtn.style.opacity = '0';
                yesBtn.style.transform = 'scale(1.5)';
                setTimeout(() => nextStep(true), 300);
            }
            else if (step.type === "shake") {
                noBtn.classList.add('shake-active');
                setTimeout(() => noBtn.classList.remove('shake-active'), 400);
            }
            else if (step.type === "spin") {
                noBtn.style.transform = `rotate(${noClickCounts[currentStep] * 360}deg)`;
                noBtn.style.transition = 'transform 0.5s ease';
            }
            else if (step.type === "bounce") {
                noBtn.classList.add('bounce-active');
                setTimeout(() => noBtn.classList.remove('bounce-active'), 400);
            }
            else if (step.type === "change_text") {
                const noTexts = ["မလုပ်ပါနဲ့", "စဉ်းစားဦးလေ", "သေချာပြီလား?", "Yes ပဲနှိပ်ပါတော့", "ငိုလိုက်ရမလား"];
                let tIdx = (noClickCounts[currentStep] - 1) % noTexts.length;
                noBtn.innerText = noTexts[tIdx];
            }
            else if (step.type === "ghost") {
                let currentOpacity = Math.max(0.1, 1 - (noClickCounts[currentStep] * 0.25));
                noBtn.style.opacity = currentOpacity;
            }
            else if (step.type === "swap") {
                const btnGroup = document.getElementById('btnGroup');
                btnGroup.style.flexDirection = noClickCounts[currentStep] % 2 === 1 ? 'row-reverse' : 'row';
            }
            else if (step.type === "disappear_brief") {
                noBtn.style.display = 'none';
                setTimeout(() => { noBtn.style.display = 'inline-block'; }, 800);
            }
            else if (step.type === "flip") {
                noBtn.style.transform = `rotateY(${noClickCounts[currentStep] * 180}deg)`;
                noBtn.style.transition = 'transform 0.4s ease';
            }
            else if (step.type === "grow_yes") {
                yesScale += 0.4;
                yesBtn.style.transform = `scale(${yesScale})`;
                yesBtn.style.transition = 'transform 0.3s ease';
            }
            else if (step.type === "disable_click") {
                if (noClickCounts[currentStep] >= 3) {
                    noBtn.disabled = true;
                    noBtn.style.background = '#94a3b8';
                    noBtn.innerText = 'ခလုတ်ပိတ်သွားပါပြီ 🔒';
                }
            }
        }

        function dodgeButton(e) {
            if (e) e.preventDefault();
            noClickCounts[currentStep]++; 
            
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '1000';

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        document.getElementById('noBtn').onclick = (e) => {
            if (activeSteps[currentStep].type === "run") {
                dodgeButton(e);
            } else {
                handleNoClick();
            }
        };

        function updateCard() {
            const s = activeSteps[currentStep];
            const mainCard = document.getElementById('mainCard');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const btnGroup = document.getElementById('btnGroup');

            mainCard.style.background = s.cardBg || "#ffffff";
            const qEl = document.getElementById('questionText');
            qEl.innerText = s.question;
            qEl.style.color = s.qColor || '#1e293b';

            yesBtn.innerText = s.yes; 
            yesBtn.style.background = s.yesColor || '#0d9488';
            noBtn.innerText = s.no;
            noBtn.style.background = s.noColor || '#f43f5e';
            noBtn.disabled = false;
            document.getElementById('statusGif').src = s.gif;
            
            yesBtn.style.transform = "scale(1)"; 
            noScale = 1; 
            noBtn.style.transform = "scale(1)"; 
            noBtn.style.opacity = "1"; 
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
            btnGroup.style.flexDirection = 'row';
            
            noBtn.onmouseover = null;
            noBtn.ontouchstart = null;

            if (s.type === "run") {
                noBtn.onmouseover = dodgeButton;
                noBtn.ontouchstart = dodgeButton;
            }
        }

        function sendAnswersToFormspree() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('sendingStatus').style.display = 'block';

            if (!FORMSPREE_URL) {
                setTimeout(() => showResult(), 600);
                return;
            }

            let formData = {};
            userAnswers.forEach((item, index) => {
                formData[`Question ${index + 1}: ${item.q}`] = `${item.a} (No clicks: ${item.noCount})`;
            });

            fetch(FORMSPREE_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(() => showResult())
            .catch(() => showResult());
        }

        function showResult() {
            const successCard = document.getElementById('successScreen');
            successCard.style.background = document.getElementById('inputSuccessBg').value || "#ffffff";
            
            const titleEl = document.getElementById('successTitleText');
            titleEl.innerText = document.getElementById('inputSuccessTitle').value;

                    </div>
                    <div class="result-no-count">❌ No clicks: ${item.noCount}</div>
                </div>`
            ).join('');
        }

        <h2 style="margin-bottom: 10px; font-size: 24px; color: ${introTitleColor};">${introTitle}</h2>
        <p style="font-size: 14px; margin-bottom: 10px; color: ${introSubColor};">${introSubtitle}</p>
        <div class="heart-start-btn" id="startHeartBtn">
            <img id="introHeartImg" src="${introGif}" alt="Heart GIF">
        </div>
    </div>

    <!-- MAIN CARD QUESTION FLOW -->
    <div class="card-container" id="mainCard" style="display: none;">
        <h2 id="questionText" style="font-size: 22px;">ပြန်ချစ်ကြည့်ကြမလား?</h2>
        <div class="gif-container"><img id="statusGif" src=""></div>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" class="choice-btn" onclick="handleInteraction(true)">ချစ်တယ်</button>
            <button id="noBtn" class="choice-btn" onclick="handleInteraction(false)">မချစ်ဘူး</button>
        </div>
        <div id="sendingStatus">အဖြေများကို ပို့ပေးနေပါသည်... 💌</div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div class="card-container" id="successScreen" style="display: none; background: ${successBg};">
        <div id="captureArea">
            <h3 id="successTitleText" style="color: ${successTitleColor};">${successTitle}</h3>
            <div id="summaryList"></div>
        </div>
    </div>

    <script>
        const activeSteps = ${stepsJson};
        const FORMSPREE_URL = ${JSON.stringify(formspreeUrl)};

        let currentStep = 0, yesScale = 1, noScale = 1, userAnswers = [];
        let noClickCounts = [];

        document.getElementById('startHeartBtn').onclick = function(e) {
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const emojis = ['❤️', '💖', '💕', '💘', '💓', '💗', '💞'];

            for (let i = 0; i < 22; i++) {
                let emojiEl = document.createElement('div');
                emojiEl.className = 'burst-emoji';
                emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                let angle = Math.random() * Math.PI * 2;
                let distance = 70 + Math.random() * 110;
                emojiEl.style.left = x + 'px';
                emojiEl.style.top = y + 'px';
                emojiEl.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
                emojiEl.style.setProperty('--dy', (Math.sin(angle) * distance) + 'px');
                document.body.appendChild(emojiEl);
                setTimeout(() => emojiEl.remove(), 800);
            }

            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
                noClickCounts = new Array(activeSteps.length).fill(0);
                currentStep = 0;
                userAnswers = [];
                yesScale = 1;
                noScale = 1;
                updateCard();
            }, 350);
        };

        function handleInteraction(isYes) {
            nextStep(isYes);
        }

        function nextStep(isYes) {
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('fullscreen-active');

            userAnswers.push({
                q: activeSteps[currentStep].question,
                a: isYes ? activeSteps[currentStep].yes : activeSteps[currentStep].no,
                noCount: noClickCounts[currentStep]
            });

            currentStep++;
            if (currentStep < activeSteps.length) {
                updateCard();
            } else {
                sendAnswersToFormspree();
            }
        }

        function handleNoClick() {
            noClickCounts[currentStep]++;

            const step = activeSteps[currentStep];
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            if (step.type === "shrink") {
                yesScale += 0.3; yesBtn.style.transform = 'scale(' + yesScale + ')';
                noScale -= 0.2; noBtn.style.transform = 'scale(' + noScale + ')';
            }
            else if (step.type === "fade") {
                noBtn.style.opacity = '0';
            }
            else if (step.type === "fullscreen") {
                yesBtn.classList.add('fullscreen-active');
            }
            else if (step.type === "magnet") {
                noBtn.style.opacity = '0';
                yesBtn.style.transform = 'scale(1.5)';
                setTimeout(() => nextStep(true), 300);
            }
            else if (step.type === "shake") {
                noBtn.classList.add('shake-active');
                setTimeout(() => noBtn.classList.remove('shake-active'), 400);
            }
            else if (step.type === "spin") {
                noBtn.style.transform = 'rotate(' + (noClickCounts[currentStep] * 360) + 'deg)';
                noBtn.style.transition = 'transform 0.5s ease';
            }
            else if (step.type === "bounce") {
                noBtn.classList.add('bounce-active');
                setTimeout(() => noBtn.classList.remove('bounce-active'), 400);
            }
            else if (step.type === "change_text") {
                const noTexts = ["မလုပ်ပါနဲ့", "စဉ်းစားဦးလေ", "သေချာပြီလား?", "Yes ပဲနှိပ်ပါတော့", "ငိုလိုက်ရမလား"];
                let tIdx = (noClickCounts[currentStep] - 1) % noTexts.length;
                noBtn.innerText = noTexts[tIdx];
            }
            else if (step.type === "ghost") {
                let currentOpacity = Math.max(0.1, 1 - (noClickCounts[currentStep] * 0.25));
                noBtn.style.opacity = currentOpacity;
            }
            else if (step.type === "swap") {
                const btnGroup = document.getElementById('btnGroup');
                btnGroup.style.flexDirection = noClickCounts[currentStep] % 2 === 1 ? 'row-reverse' : 'row';
            }
            else if (step.type === "disappear_brief") {
                noBtn.style.display = 'none';
                setTimeout(() => { noBtn.style.display = 'inline-block'; }, 800);
            }
            else if (step.type === "flip") {
                noBtn.style.transform = 'rotateY(' + (noClickCounts[currentStep] * 180) + 'deg)';
                noBtn.style.transition = 'transform 0.4s ease';
            }
            else if (step.type === "grow_yes") {
                yesScale += 0.4;
                yesBtn.style.transform = 'scale(' + yesScale + ')';
                yesBtn.style.transition = 'transform 0.3s ease';
            }
            else if (step.type === "disable_click") {
                if (noClickCounts[currentStep] >= 3) {
                    noBtn.disabled = true;
                    noBtn.style.background = '#94a3b8';
                    noBtn.innerText = 'ခလုတ်ပိတ်သွားပါပြီ 🔒';
                }
            }
        }

        function dodgeButton(e) {
            if (e) e.preventDefault();
            noClickCounts[currentStep]++;

            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '1000';

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        document.getElementById('noBtn').onclick = (e) => {
            if (activeSteps[currentStep].type === "run") {
                dodgeButton(e);
            } else {
                handleNoClick();
            }
        };

        function updateCard() {
            const s = activeSteps[currentStep];
            const mainCard = document.getElementById('mainCard');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const btnGroup = document.getElementById('btnGroup');

            mainCard.style.background = s.cardBg || "#ffffff";
            const qEl = document.getElementById('questionText');
            qEl.innerText = s.question;
            qEl.style.color = s.qColor || '#1e293b';

            yesBtn.innerText = s.yes;
            yesBtn.style.background = s.yesColor || '#0d9488';
            noBtn.innerText = s.no;
            noBtn.style.background = s.noColor || '#f43f5e';
            noBtn.disabled = false;
            document.getElementById('statusGif').src = s.gif;

            yesBtn.style.transform = "scale(1)";
            noScale = 1;
            noBtn.style.transform = "scale(1)";
            noBtn.style.opacity = "1";
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
            btnGroup.style.flexDirection = 'row';

            noBtn.onmouseover = null;
            noBtn.ontouchstart = null;

            if (s.type === "run") {
                noBtn.onmouseover = dodgeButton;
                noBtn.ontouchstart = dodgeButton;
            }
        }

        function sendAnswersToFormspree() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('sendingStatus').style.display = 'block';

            if (!FORMSPREE_URL) {
                setTimeout(() => showResult(), 600);
                return;
            }

            let formData = {};
            userAnswers.forEach((item, index) => {
                formData['မေးခွန်း ' + (index + 1) + ': ' + item.q] = item.a + ' (ငြင်းခဲ့သည့်အကြိမ်ရေ: ' + item.noCount + ' ကြိမ်)';
            });

            fetch(FORMSPREE_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(() => showResult())
            .catch(() => showResult());
        }

        function showResult() {
            const successCard = document.getElementById('successScreen');
            successCard.style.background = ${JSON.stringify(successBg)};

            const titleEl = document.getElementById('successTitleText');
            titleEl.innerText = ${JSON.stringify(successTitle)};
            titleEl.style.color = ${JSON.stringify(successTitleColor)};

            document.getElementById('mainCard').style.display = 'none';
            successCard.style.display = 'block';
            document.getElementById('summaryList').innerHTML = userAnswers.map((item, i) =>
                '<div class="result-item">' +
                    '<div class="result-row">' +
                        '<span class="result-q">' + (i+1) + '. ' + item.q + '</span>' +
                        '<span class="result-a">' + item.a + '</span>' +
                    '</div>' +
                    '<div class="result-no-count">❌ ငြင်းခဲ့သည့်အကြိမ်ရေ: ' + item.noCount + ' ကြိမ်</div>' +
                '</div>'
            ).join('');
        }
    <\/script>
</body>
</html>`;
        }

        // --- TELEGRAM BOT SENDER ---
        async function sendToTelegramBot() {
            const botToken = "8883736685:AAFOMls5VSwNkasnlkjKp4Uhd3P03Yxx-Po";
            const chatId = "8113541021";

            const imageInput = document.getElementById('telegramImageFile');
            const fileNameInput = document.getElementById('telegramHtmlFileName');
            const statusEl = document.getElementById('telegramStatus');

            if (!imageInput.files || imageInput.files.length === 0) {
                alert("Please select an image.");
                return;
            }

            let htmlFileName = fileNameInput.value.trim();
            if (!htmlFileName) {
                htmlFileName = "index.html";
            } else if (!htmlFileName.endsWith('.html')) {
                htmlFileName += '.html';
            }

            statusEl.style.display = 'block';
            statusEl.style.color = '#2563eb';
            statusEl.innerText = "Sending to Telegram…";

            try {
                const imageFile = imageInput.files[0];
                const photoFormData = new FormData();
                photoFormData.append('chat_id', chatId);
                photoFormData.append('photo', imageFile);
                photoFormData.append('caption', `📷 Image for: ${htmlFileName}`);

                const photoResponse = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                    method: 'POST',
                    body: photoFormData
                });

                if (!photoResponse.ok) {
                    throw new Error("Image sending failed. Check bot token / chat ID.");
                }

                const htmlContent = generatePreviewHtml();
                const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
                const htmlFile = new File([htmlBlob], htmlFileName, { type: 'text/html' });

                const docFormData = new FormData();
                docFormData.append('chat_id', chatId);
                docFormData.append('document', htmlFile);
                docFormData.append('caption', `📄 HTML file: ${htmlFileName}`);

                const docResponse = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
                    method: 'POST',
                    body: docFormData
                });

                if (!docResponse.ok) {
                    throw new Error("HTML file sending failed.");
                }

                statusEl.style.color = '#16a34a';
                statusEl.innerText = "✅ Image and HTML sent to Telegram!";
            } catch (error) {
                statusEl.style.color = '#dc2626';
                statusEl.innerText = "❌ Error: " + error.message;
            }
        }

        renderEditorSteps();
    </script>
</body>
</html>
